name: Push Lunar Calendar to iCloud

on:
  schedule:
    - cron: "10 16 1 * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "generate_lunar_calendar.py"

jobs:
  push-to-icloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install lunar_python opencc-python-reimplemented caldav

      - name: Push events to iCloud calendar
        env:
          ICLOUD_APPLE_ID: ${{ secrets.ICLOUD_APPLE_ID }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          CALENDAR_NAME: "農曆行事曆"
        run: |
          python3 generate_lunar_calendar.py --years-ahead 3
